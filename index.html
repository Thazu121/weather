<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="bgImage"></div>

    <div class="overlay">
        <div class="container min-vh-100 d-flex justify-content-center align-items-center">
            <div class="card weather-card shadow-lg border-0">
                <div class="card-body p-4">

                    <div class="input-group mb-4">
                        <input type="text" id="cityName" class="form-control form-control-lg"
                            placeholder="Enter city name">
                        <button class="btn btn-light" id="searchBtn">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>

                    <div id="loading" class="text-center d-none">
                        <div class="spinner-border text-light"></div>
                    </div>

                    <div id="error" class="alert alert-danger d-none"></div>

                    <div id="weatherContent" class="text-center text-white">
                        <i id="weatherIcon" class="fa-solid fa-cloud-sun weather-icon mb-3"></i>
                        <h1 id="temperature" class="fw-bold">--°C</h1>
                        <h2 id="city" class="fw-light">--</h2>
                        <p id="description" class="text-white-50"></p>
                    </div>

                    <div class="row text-white mt-4">
                        <div class="col-6 text-center border-end">
                            <h3 id="humidity">--%</h3>
                            <p>Humidity</p>
                        </div>
                        <div class="col-6 text-center">
                            <h3 id="wind">-- km/h</h3>
                            <p>Wind</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
