<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-dark">
        <div class="container min-vh-100 d-flex justify-content-center align-items-center">
            <div class="card shadow-lg border-0 weather-card">
                <div class="card-body p-4">
                    <div class="input-group mb-5">
                        <input type="text" name="cityName" id="cityName"
                            class="form-control form-control-lg border-0 shadow-sm">
                        <button class="btn btn-light shadow-sm" id="searchBtn">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>


                    <div id="loading" class="text-center text-secondary d-none text-white">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>

                    <div id="error" class=" alert alert-danger d-none" role="alert"></div>
                    <div id="weatherContent">
                        <div class="text-center mb-4 text-white">
                            <i id="weatherIcon" class="fa-solid fa-cloud-sun weather-icon"></i>
                        </div>
                    </div>
                    <div>
                        <h1 id="temperature" class="text-center mb-2 fw-bold text-white mb-0">--°C</h1>
                    </div>
                    <div class="text-center mb-2">
                        <h2 id="city" class="fs-1 text-white fw-light">--</h2>

                        <p id="description" class=" text-white-50 text-capitalize mb-0">
                        </p>
                    </div>

                    <div class="row text-white mt-4">
                        <div class="col-6 text-center border-end border-white">
                            <h3 id="humidity" class="fs-2 fw-bold mb-1">--</h3>
                            <p class="mb-0 text-center   text-white">Humidity</p>
                        </div>
                        <div class="col-6 text-center">
                            <h3 id="wind" class="fs-2 fw-bold mb-1">--</h3>
                            <i class="fa-solid fa-wind"></i>
                            <p class="mb-0 text-center   text-white">Wind Speed</p>
                        </div>
                        <div class=""></div>
                    </div>
                </div>
            </div>


            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
                crossorigin="anonymous"></script>
                <script src="index.js"></script>
</body>

</html>
